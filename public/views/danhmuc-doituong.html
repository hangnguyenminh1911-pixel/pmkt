<div id="view-danhmuc-dt" class="hidden space-y-4">
    <!-- Thanh công cụ: Tìm kiếm + Lọc theo Phân loại + Nút Thêm mới -->
    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border flex-wrap gap-3">
        <div class="flex items-center space-x-2 flex-wrap gap-2">
            <input type="text" id="tim-kiem-dt" onkeyup="if(event.key === 'Enter') locDanhSachDT()" placeholder="Tìm theo mã, tên hoặc MST..." class="px-3.5 py-1.5 border rounded-lg text-sm w-72 focus:outline-none focus:ring-2 focus:ring-orange-700">
            
            <select id="loc-phanloai-dt" onchange="locDanhSachDT()" class="px-3 py-1.5 border rounded-lg text-sm bg-white font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-700 cursor-pointer">
                <option value="tat_ca">-- Tất cả đối tượng --</option>
                <option value="khach_hang">Khách hàng</option>
                <option value="nha_cung_cap">Nhà cung cấp</option>
            </select>

            <button type="button" onclick="locDanhSachDT()" class="bg-orange-900 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-orange-800 transition">Tìm</button>
            <button type="button" onclick="datLaiBoLocDT()" class="bg-gray-100 text-gray-700 border px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Đặt lại</button>
        </div>
        <!-- Cụm công cụ bên phải: Bọc cả 3 nút vào 1 thẻ div flex để chúng dính liền với nhau -->
        <div class="flex items-center space-x-2 shrink-0">
            <!-- Nút Xuất Excel -->
            <button type="button" onclick="xuatExcelDT()" class="bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-emerald-800 transition flex items-center shadow-xs">
                <i class="fa-solid fa-file-excel mr-1.5"></i> Xuất Excel
            </button>

            <!-- Nút Nhập Excel -->
            <button type="button" onclick="moModalChonFileImport('doituong')" class="bg-teal-700 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-teal-800 transition flex items-center shadow-xs">
                <i class="fa-solid fa-file-import mr-1.5"></i> Nhập Excel
            </button>

            <!-- Nút Thêm đối tượng -->
            <button type="button" onclick="moModalThemDT()" class="bg-green-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-green-600 transition flex items-center shadow-xs">
                <i class="fa-solid fa-plus mr-1.5"></i> Thêm đối tượng
            </button>
            
            <!-- Nút Xóa hàng loạt đối tượng -->
             <button type="button" id="btn-xoa-nhieu-dt" onclick="xoaNhieuDT()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center shadow-xs">
                <i class="fa-solid fa-trash-can mr-1.5"></i> Xóa đã chọn (<span id="count-chon-dt">0</span>)
            </button>
        </div>
    </div>

    <!-- Bảng danh sách đối tượng kèm Footer -->
    <div class="bg-white border rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50 border-b text-gray-600 text-xs uppercase tracking-wider">
                <tr>
                    <th class="py-3 px-3 text-center w-10">
                        <input type="checkbox" id="chk-all-dt" onchange="chonTatCaDT(this)" class="rounded text-orange-900 focus:ring-orange-700 cursor-pointer">
                    </th>
                    <th class="py-3 px-4 w-12 text-center">STT</th>
                    <th class="py-3 px-4">Mã đối tượng</th>
                    <th class="py-3 px-4">Tên đối tượng</th>
                    <th class="py-3 px-4">Mã số thuế</th>
                    <th class="py-3 px-4">Địa chỉ</th>
                    <th class="py-3 px-4 text-center">Phân loại</th>
                    <th class="py-3 px-4 text-center w-36">Thao tác</th>
                </tr>
            </thead>
            <tbody id="tbody-danhmuc-dt" class="divide-y divide-gray-200 text-sm text-gray-700">
                <!-- Dữ liệu nạp từ server -->
            </tbody>
        </table>

        <!-- FOOTER: HIỂN THỊ TỔNG SỐ DÒNG ĐỐI TƯỢNG -->
        <div class="bg-gray-50 px-4 py-3 border-t flex justify-between items-center text-sm text-gray-600">
            <div>
                Tổng số: <span id="lbl-tong-so-dt" class="font-bold text-orange-900">00</span> đối tượng
            </div>
            <div class="text-xs text-gray-500">
                <span>Dữ liệu đồng bộ máy chủ</span>
            </div>
        </div>
    </div>
</div>

<div id="view-hethong-taikhoan" class="hidden space-y-4">
    <!-- Thanh công cụ tìm kiếm -->
    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border flex-wrap gap-3">
        <div class="flex items-center space-x-2">
            <input type="text" id="tim-kiem-tk" onkeyup="locHeThongTaiKhoan()" placeholder="Tìm theo số hiệu hoặc tên tài khoản..." class="px-3.5 py-1.5 border rounded-lg text-sm w-80 focus:outline-none focus:ring-2 focus:ring-orange-700">
        </div>
        <div class="text-xs text-gray-500 font-medium">
            Hệ thống tài khoản chuẩn theo chế độ kế toán
        </div>
    </div>

    <!-- Bảng danh sách tài khoản -->
    <div class="bg-white border rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50 border-b text-gray-600 text-xs uppercase tracking-wider">
                <tr>
                    <th class="py-3 px-4 w-16 text-center">STT</th>
                    <th class="py-3 px-4 w-36 text-center">Số hiệu tài khoản</th>
                    <th class="py-3 px-4">Tên tài khoản kế toán</th>
                    <th class="py-3 px-4 text-center w-28">Cấp</th>
                    <th class="py-3 px-4 text-center w-36">Tính chất</th>
                </tr>
            </thead>
            <tbody id="tbody-hethong-taikhoan" class="divide-y divide-gray-200 text-sm text-gray-700">
                <!-- Nạp dữ liệu động bằng JavaScript -->
            </tbody>
        </table>
    </div>
</div>

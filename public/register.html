<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Phần mềm Kế toán</title>
    <!-- Sử dụng Tailwind CSS đồng bộ với các trang khác -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

    <!-- KHUNG FORM YÊU CẦU CẤP TÀI KHOẢN -->
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg border mt-10">
        <h3 class="text-lg font-bold text-gray-800 mb-4 text-center">
            <i class="fa-solid fa-user-clock mr-2 text-orange-900"></i>Yêu cầu cấp tài khoản sử dụng
        </h3>
        
        <form id="requestAccountForm" onsubmit="guiYeuCauDangKy(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-medium text-gray-700 mb-1">Họ và tên <span class="text-red-500">*</span></label>
                <input type="text" id="input-hoten" required placeholder="Nhập họ và tên của bạn..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-700 text-sm">
            </div>

            <div>
                <label class="block font-medium text-gray-700 mb-1">Email nhận thông tin <span class="text-red-500">*</span></label>
                <input type="email" id="input-email" required placeholder="nhapemail@domain.com..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-700 text-sm">
            </div>

            <div>
                <label class="block font-medium text-gray-700 mb-1">Số điện thoại <span class="text-red-500">*</span></label>
                <input type="tel" id="input-dienthoai" required placeholder="Nhập số điện thoại liên hệ..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-700 text-sm">
            </div>

            <div>
                <label class="block font-medium text-gray-700 mb-1">Mã số thuế <span class="text-red-500">*</span></label>
                <input type="text" id="input-mst" required placeholder="Nhập mã số thuế doanh nghiệp/hộ KD..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-700 text-sm">
            </div>

            <div>
                <label class="block font-medium text-gray-700 mb-1">Tên đơn vị / Hộ kinh doanh <span class="text-red-500">*</span></label>
                <input type="text" id="input-donvi" required placeholder="Tên công ty hoặc hộ kinh doanh..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-700 text-sm">
            </div>

            <button type="submit" id="btn-submit-req" class="w-full bg-orange-900 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-orange-800 transition shadow-sm">
                Gửi yêu cầu xét duyệt
            </button>
        </form>
    </div>

    <!-- JavaScript xử lý giao diện và gọi API đăng ký (Mục 5) -->
    <script>
        async function guiYeuCauDangKy(event) {
            event.preventDefault(); // Ngăn chặn load lại trang

            const hoTen = document.getElementById('input-hoten').value.trim();
            const email = document.getElementById('input-email').value.trim();
            const dienThoai = document.getElementById('input-dienthoai').value.trim();
            const mst = document.getElementById('input-mst').value.trim();
            const donVi = document.getElementById('input-donvi').value.trim();
            const btnSubmit = document.getElementById('btn-submit-req');

            // Khóa nút và hiển thị trạng thái đang gửi
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Đang gửi yêu cầu...`;

            try {
                const response = await fetch('/api/request-account', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    // ĐỒNG BỘ TÊN TRƯỜNG DỮ LIỆU KHỚP VỚI BACKEND VÀ ADMIN.HTML
                    body: JSON.stringify({ 
                        hoTen, 
                        email, 
                        sdt: dienThoai,         // Đổi từ dienThoai thành sdt
                        mst, 
                        tenDoanhNghiep: donVi   // Đổi từ donVi thành tenDoanhNghiep
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    document.getElementById('requestAccountForm').reset();
                } else {
                    alert(result.message || "Có lỗi xảy ra, vui lòng thử lại!");
                }

            } catch (error) {
                console.error("Lỗi kết nối:", error);
                alert("Không thể kết nối đến máy chủ! Vui lòng kiểm tra lại đường truyền mạng.");
            } finally {
                // Mở lại nút bấm
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = "Gửi yêu cầu xét duyệt";
            }
        }
        function hienThiThongBao(noiDung, loai) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.textContent = noiDung;
            alertDiv.classList.remove('hidden', 'bg-red-100', 'text-red-600', 'bg-emerald-100', 'text-emerald-700');

            if (loai === "error") {
                alertDiv.classList.add('bg-red-100', 'text-red-600');
            } else {
                alertDiv.classList.add('bg-emerald-100', 'text-emerald-700');
            }
        }

    </script>
</body>
</html>

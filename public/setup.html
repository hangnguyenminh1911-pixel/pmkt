<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo mới dữ liệu kế toán - Phần mềm Kế toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 rounded-lg shadow-md w-[500px]">
        <h2 class="text-2xl font-bold text-center text-orange-700 mb-2">TẠO MỚI DỮ LIỆU KẾ TOÁN</h2>
        <p class="text-gray-500 text-center text-sm mb-6">Nhập thông tin đơn vị kinh doanh hoặc hộ kinh doanh của bạn</p>
        
        <form onsubmit="khoiTaoDuLieuKeToan(event)">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Tên Công ty / Hộ kinh doanh <span class="text-red-500">*</span></label>
                <input type="text" id="setup-ten-donvi" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Ví dụ: Hộ kinh doanh Nguyễn Văn A">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Mã số thuế <span class="text-red-500">*</span></label>
                <input type="text" id="setup-mst" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Nhập mã số thuế...">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Địa chỉ <span class="text-red-500">*</span></label>
                <input type="text" id="setup-diachi" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Nhập địa chỉ...">
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Năm tài chính <span class="text-red-500">*</span></label>
                    <input type="number" id="setup-nam" value="2026" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Chế độ kế toán <span class="text-red-500">*</span></label>
                    <select id="setup-che-do" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white">
                        <option value="TT152">Thông tư 152/TT-BTC (Hộ kinh doanh)</option>
                        <option value="TT133" selected>Thông tư 133/2016/TT-BTC (Doanh nghiệp vừa & nhỏ)</option>
                        <option value="TT99">Thông tư 99/TT-BTC (Doanh nghiệp lớn)</option>
                    </select>
                </div>
            </div>

            <div class="flex space-x-4">
                <a href="index.html" class="w-1/2 text-center bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg hover:bg-gray-400 transition duration-200">
                    Quay lại
                </a>
                <button type="submit" class="w-1/2 bg-orange-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-orange-800 transition duration-200">
                    Lưu & Khởi tạo
                </button>
            </div>
        </form>
    </div>

    <script>
        function khoiTaoDuLieuKeToan(event) {
            event.preventDefault();

            const thongTin = {
                tenDonVi: document.getElementById('setup-ten-donvi').value.trim(),
                mst: document.getElementById('setup-mst').value.trim(),
                diaChi: document.getElementById('setup-diachi').value.trim(),
                namTaiChinh: document.getElementById('setup-nam').value.trim() || "2026",
                cheDoKeToan: document.getElementById('setup-che-do').value // 'TT152' | 'TT133' | 'TT99'
            };

            // Lưu toàn bộ vào localStorage
            localStorage.setItem('BIZMATE_THONGTIN_DOANHNGHIEP', JSON.stringify(thongTin));
            // Lưu kèm khóa riêng cho chế độ kế toán
            localStorage.setItem('BIZMATE_CHEDO_KETOAN', thongTin.cheDoKeToan);

            alert(`Khởi tạo thành công dữ liệu cho "${thongTin.tenDonVi}" theo chế độ ${document.getElementById('setup-che-do').selectedOptions[0].text}!`);
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>

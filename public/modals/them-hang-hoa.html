<div id="modal-them-hang-hoa" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] hidden">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl overflow-hidden border">
        <!-- Header -->
        <div class="bg-orange-950 text-white px-5 py-3 flex justify-between items-center">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-box-open mr-2"></i>Thêm nhanh Vật tư, Hàng hóa</h3>
            <button type="button" onclick="dongModalThemHH()" class="text-white/80 hover:text-white text-lg font-bold">&times;</button>
        </div>

        <!-- Body -->
        <div class="p-5 space-y-3 text-xs text-gray-700 max-h-[80vh] overflow-y-auto">
            
            <!-- 1. Tính chất & Tài khoản kho -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium mb-1">Tính chất <span class="text-red-500">*</span></label>
                    <select id="quick-tinhchat-hh" onchange="doiTinhChatHangHoa(this.value)" class="w-full px-2.5 py-1.5 border rounded bg-white font-medium text-orange-900 focus:outline-none focus:ring-1 focus:ring-orange-700">
                        <option value="hanghoa" selected>Hàng hóa</option>
                        <option value="dichvu">Dịch vụ</option>
                        <option value="nguyenvatlieu">Nguyên vật liệu</option>
                        <option value="thanhpham">Thành phẩm</option>
                        <option value="congcudungcu">Công cụ dụng cụ</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium mb-1">Tài khoản kho <span class="text-red-500">*</span></label>
                    <select id="quick-tkkho-hh" class="w-full px-2.5 py-1.5 border rounded bg-white font-medium text-gray-800 focus:outline-none focus:ring-1 focus:ring-orange-700">
                        <option value="156">156 - Hàng hóa</option>
                        <option value="152">152 - Nguyên liệu, vật liệu</option>
                        <option value="153">153 - Công cụ, dụng cụ</option>
                        <option value="155">155 - Thành phẩm</option>
                        <option value="154">154 - Chi phí SXKD dở dang</option>
                        <option value="khong">Không theo dõi kho (Dịch vụ)</option>
                    </select>
                </div>
            </div>

            <!-- 2. Mã & ĐVT chính -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium mb-1">Mã hàng hóa (SKU) <span class="text-red-500">*</span></label>
                    <input type="text" id="quick-ma-hh" placeholder="Ví dụ: SP003" class="w-full px-2.5 py-1.5 border rounded uppercase font-semibold text-orange-900 focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div>
                    <label class="block font-medium mb-1">ĐVT chính <span class="text-red-500">*</span></label>
                    <input type="text" id="quick-dvt-hh" placeholder="Cái, Kg, Chai..." value="Cái" oninput="capNhatMoTaQuyDoi()" class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
            </div>

            <!-- 3. Tên vật tư hàng hóa -->
            <div>
                <label class="block font-medium mb-1">Tên vật tư, hàng hóa <span class="text-red-500">*</span></label>
                <input type="text" id="quick-ten-hh" placeholder="Nhập tên chi tiết hàng hóa..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
            </div>

            <!-- 4. Tồn kho & Đơn giá bán -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block font-medium mb-1">SL tồn kho ban đầu</label>
                    <input type="number" id="quick-ton-hh" value="0" min="0" class="w-full px-2.5 py-1.5 border rounded text-right focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div>
                    <label class="block font-medium mb-1">Giá mua mặc định</label>
                    <input type="text" id="quick-giamua-hh" placeholder="0" oninput="formatNumberInput(this)" class="w-full px-2.5 py-1.5 border rounded text-right font-medium text-gray-800 focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div>
                    <label class="block font-medium mb-1">Đơn giá bán mặc định</label>
                    <input type="text" id="quick-gia-hh" placeholder="0" oninput="formatNumberInput(this)" class="w-full px-2.5 py-1.5 border rounded text-right font-medium text-blue-700 focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
            </div>

            <!-- KHỐI BẢNG ĐƠN VỊ CHUYỂN ĐỔI (CHUẨN MISA) -->
            <div class="border rounded-lg bg-white overflow-hidden mt-3 shadow-sm border-gray-300">
                <!-- Header Collapsible -->
                <div class="bg-gray-50 px-3 py-2 border-b flex items-center justify-between cursor-pointer" onclick="toggleDonViChuyenDoi()">
                    <div class="flex items-center space-x-2 text-emerald-700 font-bold text-xs">
                        <span class="w-4 h-4 border border-emerald-700 rounded flex items-center justify-center text-[10px] bg-white font-bold" id="icon-toggle-quydoi">-</span>
                        <span class="text-emerald-800 text-sm">Đơn vị chuyển đổi</span>
                    </div>
                </div>

                <!-- Nội dung phần quy đổi -->
                <div id="box-don-vi-quydoi" class="p-3 space-y-2 text-xs">
                    <!-- Dòng chú thích / Hướng dẫn -->
                    <div class="flex items-start space-x-2 text-gray-500 text-[11px] bg-gray-50 p-2 rounded border border-gray-200">
                        <i class="fa-solid fa-circle-info text-emerald-600 mt-0.5 text-xs"></i>
                        <div>
                            Trường hợp vật tư, hàng hóa sử dụng đơn vị tính khác nhau khi nhập/xuất thì khai báo thêm các đơn vị tính ở đây.<br>
                            <span class="italic text-gray-400">VD: 1 tạ = 100kg, 1 két bia = 20 chai, ...</span>
                        </div>
                    </div>

                    <!-- Bảng danh sách các đơn vị chuyển đổi -->
                    <div class="border rounded overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-gray-100 text-gray-700 border-b">
                                <tr>
                                    <th class="py-2 px-3 border-r font-semibold w-32 text-center align-middle">Đơn vị chuyển đổi</th>
                                    <th class="py-2 px-3 border-r font-semibold w-32 text-center align-middle">Tỷ lệ chuyển đổi</th>
                                    <th class="py-2 px-3 border-r font-semibold w-32 text-center align-middle">Phép tính</th>
                                    <!-- Cho cột Mô tả chiếm toàn bộ không gian còn lại (tối thiểu 200px) -->
                                    <th class="py-2 px-3 border-r font-semibold min-w-[200px] text-center align-middle">Mô tả</th>
                                    <th class="py-2 px-2 text-center w-10 text-center align-middle">Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-don-vi-chuyen-doi" class="divide-y divide-gray-200">
                                <!-- Dòng dữ liệu mẫu ban đầu -->
                                <tr class="quydoi-row hover:bg-emerald-50/30">
                                    <td class="p-1.5 border-r">
                                        <input type="text" placeholder="Ví dụ: Gói" oninput="tuDongTinhMoTa(this)" class="w-full px-2 py-1 border rounded focus:outline-none focus:ring-1 focus:ring-emerald-600 qd-dvt">
                                    </td>
                                    <td class="p-1.5 border-r">
                                        <input type="number" value="1" min="0.0001" step="any" oninput="tuDongTinhMoTa(this)" class="w-full px-2 py-1 border rounded text-right focus:outline-none focus:ring-1 focus:ring-emerald-600 qd-tyle">
                                    </td>
                                    <td class="p-1.5 border-r">
                                        <select onchange="tuDongTinhMoTa(this)" class="w-full px-2 py-1 border rounded bg-white focus:outline-none focus:ring-1 focus:ring-emerald-600 qd-pheptinh">
                                            <option value="nhan">Phép nhân</option>
                                            <option value="chia">Phép chia</option>
                                        </select>
                                    </td>
                                    <td class="p-1.5 border-r">
                                        <input type="text" readonly placeholder="1 Gói = 1 Cái" class="w-full px-2.5 py-1 border rounded bg-gray-50 text-emerald-800 font-semibold qd-mota">
                                    </td>
                                    <td class="p-1.5 text-center">
                                        <button type="button" onclick="xoaDongQuyDoi(this)" class="text-red-500 hover:text-red-700 text-sm" title="Xóa dòng"><i class="fa-solid fa-trash-can"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Các nút Thao tác thêm/xóa dòng -->
                    <div class="flex space-x-2 pt-1">
                        <button type="button" onclick="themDongQuyDoi()" class="px-3 py-1 border rounded bg-white hover:bg-gray-50 text-gray-700 text-xs font-medium shadow-sm transition">
                            <i class="fa-solid fa-plus text-emerald-600 mr-1"></i> Thêm dòng
                        </button>
                        <button type="button" onclick="xoaHetDongQuyDoi()" class="px-3 py-1 border rounded bg-white hover:bg-red-50 text-red-600 text-xs font-medium shadow-sm transition">
                            <i class="fa-solid fa-eraser mr-1"></i> Xóa hết dòng
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-5 py-3 border-t flex justify-end space-x-2">
            <button type="button" onclick="dongModalThemHH()" class="px-3 py-1.5 border rounded text-gray-600 hover:bg-gray-100">Hủy bỏ</button>
            <button type="button" onclick="luuNhanhHangHoa()" class="bg-orange-900 text-white px-4 py-1.5 rounded font-medium hover:bg-orange-800">Lưu vào danh mục</button>
        </div>
    </div>
</div>

<div id="modal-nganhang" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border">
        <div class="bg-orange-900 text-white px-6 py-4 flex justify-between items-center">
            <h3 id="modal-nh-title" class="font-bold text-sm flex items-center">
                <i class="fa-solid fa-building-columns mr-2 text-yellow-300"></i> Thêm tài khoản ngân hàng
            </h3>
            <button onclick="dongModalNganHang()" class="text-white/80 hover:text-white text-xl font-bold">&times;</button>
        </div>
        
        <div class="p-6 space-y-4 text-xs text-gray-700">
            <input type="hidden" id="nh-is-edit" value="0">
            
            <div>
                <label class="block font-semibold text-gray-800 mb-1">Số tài khoản (STK) *:</label>
                <input type="text" id="nh-stk" placeholder="Nhập số tài khoản..." class="w-full px-3.5 py-2 border rounded-lg font-mono font-bold text-orange-900 text-sm focus:outline-none focus:ring-1 focus:ring-orange-700">
            </div>

            <div>
                <label class="block font-semibold text-gray-800 mb-1">Tên ngân hàng *:</label>
                <input type="text" id="nh-ten" placeholder="Ví dụ: Techcombank, Vietcombank..." class="w-full px-3.5 py-2 border rounded-lg font-semibold text-gray-800 text-sm focus:outline-none focus:ring-1 focus:ring-orange-700">
            </div>

            <div>
                <label class="block font-semibold text-gray-800 mb-1">Chi nhánh:</label>
                <input type="text" id="nh-chinhanh" placeholder="Ví dụ: Chi nhánh Hải Phòng..." class="w-full px-3.5 py-2 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-orange-700">
            </div>

            <div>
                <label class="block font-semibold text-gray-800 mb-1">Tài khoản kế toán ngầm định:</label>
                <input type="text" id="nh-tkketoan" value="1121" class="w-full px-3.5 py-2 border rounded-lg font-mono font-semibold text-blue-700 text-sm focus:outline-none focus:ring-1 focus:ring-orange-700">
            </div>
        </div>

        <div class="bg-gray-50 px-6 py-3.5 border-t flex justify-end space-x-2">
            <button onclick="dongModalNganHang()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100 font-medium text-sm">Hủy</button>
            <button onclick="luuTaiKhoanNganHang()" class="bg-orange-900 text-white px-5 py-2 rounded-lg font-medium text-sm hover:bg-orange-800 transition shadow-sm">
                <i class="fa-solid fa-save mr-1.5"></i> Lưu thông tin
            </button>
        </div>
    </div>
</div>

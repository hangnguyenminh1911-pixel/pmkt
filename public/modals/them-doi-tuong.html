<div id="modal-them-doi-tuong" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] hidden">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl overflow-hidden border">
        <!-- Header -->
        <div class="bg-orange-950 text-white px-5 py-3 flex justify-between items-center">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-user-plus mr-2"></i>Thông tin Đối tượng</h3>
            <button type="button" onclick="dongModalThemDT()" class="text-white/80 hover:text-white text-lg font-bold">&times;</button>
        </div>

        <!-- Body -->
        <div class="p-6 space-y-4 text-xs text-gray-700 max-h-[82vh] overflow-y-auto">
            
            <!-- Hàng 1: Loại hình (Tổ chức / Cá nhân) & Phân loại (KH / NCC) -->
            <div class="flex flex-wrap items-center justify-between pb-3 border-b gap-4">
                <div class="flex items-center space-x-5">
                    <label class="flex items-center space-x-1.5 cursor-pointer font-medium text-gray-800">
                        <input type="radio" name="quick_loai_hinh" value="to_chuc" checked class="text-orange-900 focus:ring-orange-700">
                        <span>Tổ chức</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer font-medium text-gray-800">
                        <input type="radio" name="quick_loai_hinh" value="ca_nhan" class="text-orange-900 focus:ring-orange-700">
                        <span>Cá nhân</span>
                    </label>
                </div>

                <div class="flex items-center space-x-4 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200">
                    <span class="font-semibold text-orange-950">Phân loại:</span>
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="checkbox" id="quick-is-kh" checked class="rounded text-orange-900 focus:ring-orange-700">
                        <span class="font-medium text-gray-800">Là khách hàng</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="checkbox" id="quick-is-ncc" class="rounded text-orange-900 focus:ring-orange-700">
                        <span class="font-medium text-gray-800">Là nhà cung cấp</span>
                    </label>
                </div>
            </div>

            <!-- Hàng 2: Mã số thuế, Mã ĐVCQHNS, Điện thoại -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block font-medium mb-1">Mã số thuế</label>
                    <div class="relative flex items-center">
                        <input type="text" id="quick-mst-dt" onkeyup="if(event.key === 'Enter') traCuuMaSoThue()" placeholder="MST doanh nghiệp..." class="w-full pl-2.5 pr-9 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
                        <!-- Nút kính lúp tra cứu -->
                        <button type="button" id="btn-tracuu-mst" onclick="traCuuMaSoThue()" class="absolute right-1 w-7 h-7 bg-orange-900 text-white rounded hover:bg-orange-800 flex items-center justify-center text-xs transition" title="Tra cứu thông tin theo MST">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block font-medium mb-1">Mã ĐVCQHNS</label>
                    <input type="text" id="quick-cqhns-dt" placeholder="Mã QHNS (nếu có)..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div>
                    <label class="block font-medium mb-1">Điện thoại</label>
                    <input type="text" id="quick-dienthoai-dt" placeholder="Số điện thoại bàn/di động..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
            </div>

            <!-- Hàng 3: Mã đối tượng & Tên đối tượng -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block font-medium mb-1">Mã đối tượng <span class="text-red-500">*</span></label>
                    <input type="text" id="quick-ma-dt" placeholder="Ví dụ: DT001, KH003..." class="w-full px-2.5 py-1.5 border rounded uppercase font-semibold text-orange-900 focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div class="col-span-2">
                    <label class="block font-medium mb-1">Tên đối tượng <span class="text-red-500">*</span></label>
                    <input type="text" id="quick-ten-dt" placeholder="Tên công ty hoặc tên người mua..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700 font-medium">
                </div>
            </div>

            <!-- Hàng 4: Địa chỉ -->
            <div>
                <label class="block font-medium mb-1">Địa chỉ trụ sở / Giao dịch</label>
                <input type="text" id="quick-diachi-dt" placeholder="Địa chỉ chi tiết..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
            </div>

            <!-- Hàng 5: Thông tin liên hệ & Hóa đơn điện tử -->
            <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3 rounded-lg border">
                <div>
                    <label class="block font-medium mb-1 text-gray-700">Người liên hệ / Đại diện PL</label>
                    <input type="text" id="quick-nguoilh-dt" placeholder="Họ tên người liên hệ..." class="w-full px-2.5 py-1.5 border rounded bg-white focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div>
                    <label class="block font-medium mb-1 text-gray-700">Email nhận HĐĐT</label>
                    <input type="email" id="quick-email-dt" placeholder="email@congty.com..." class="w-full px-2.5 py-1.5 border rounded bg-white focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
            </div>

            <!-- Hàng 6: Tài khoản ngân hàng (Chi tiền / Thu tiền CK) -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block font-medium mb-1">Số tài khoản NH</label>
                    <input type="text" id="quick-tknh-dt" placeholder="Số TK..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
                <div class="col-span-2">
                    <label class="block font-medium mb-1">Tại ngân hàng (Tên NH & Chi nhánh)</label>
                    <input type="text" id="quick-nganhang-dt" placeholder="Ví dụ: Vietcombank - CN Hải Phòng..." class="w-full px-2.5 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-orange-700">
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-6 py-3 border-t flex justify-end space-x-2">
            <button type="button" onclick="dongModalThemDT()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100 font-medium">Hủy bỏ</button>
            <button type="button" onclick="luuNhanhDoiTuong()" class="bg-orange-900 text-white px-5 py-2 rounded-lg font-medium hover:bg-orange-800">Lưu vào danh mục</button>
        </div>
    </div>
</div>
